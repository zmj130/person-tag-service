server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: person-tag-service
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: ${DM_URL:jdbc:dm://10.3.6.130:5237?schema=PERSON_TAG}
    username: ${DM_USERNAME:PERSON_TAG}
    password: ${DM_PASSWORD:Dtc@2026}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
remote-person:
  # mock 便于本地演示；生产环境改成 http。
  mode: ${REMOTE_PERSON_MODE:mock}
  base-url: ${REMOTE_PERSON_BASE_URL:http://127.0.0.1:18080}
  token: ${REMOTE_PERSON_TOKEN:change-me}
  page-size: ${REMOTE_PERSON_PAGE_SIZE:200}
  connect-timeout-ms: ${REMOTE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${REMOTE_READ_TIMEOUT_MS:10000}
scheduler:
  # DolphinScheduler 调用内部任务接口时必须携带 X-Scheduler-Token。
  token: ${SCHEDULER_TOKEN:a4520a6f-dd1c-4a60-84f2-c6c68fbdf4e6}
profile-search:
  enabled: ${ES_ENABLED:true}
  url: ${ES_URL:http://10.3.7.225:9200}
  index: ${ES_INDEX:person_tag_resume_demo_v1}
  username: ${ES_USERNAME:}
  password: ${ES_PASSWORD:}
  max-documents: ${ES_MAX_DOCUMENTS:5000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
