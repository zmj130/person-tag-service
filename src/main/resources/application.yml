server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: person-tag-service
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: ${DM_URL:jdbc:dm://127.0.0.1:5236?schema=PERSON_TAG}
    username: ${DM_USERNAME:PERSON_TAG}
    password: ${DM_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
remote-person:
  # mock 便于本地演示；生产环境改成 http。
  mode: ${REMOTE_PERSON_MODE:mock}
  base-url: ${REMOTE_PERSON_BASE_URL:http://127.0.0.1:18080}
  token: ${REMOTE_PERSON_TOKEN:change-me}
  page-size: ${REMOTE_PERSON_PAGE_SIZE:200}
  connect-timeout-ms: ${REMOTE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${REMOTE_READ_TIMEOUT_MS:10000}
scheduler:
  # DolphinScheduler 调用内部任务接口时必须携带 X-Scheduler-Token。
  token: ${SCHEDULER_TOKEN:local-demo-token}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

